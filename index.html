.wx .city{font-size:40px;color:var(--dim)}
.wx .ico{width:140px;height:140px;animation:bob 4s ease-in-out infinite}
.wx .ico svg{width:100%;height:100%}

.wx .temp{direction:ltr;text-align:right;font-family:'Big Shoulders Display','Heebo',Impact,sans-serif;font-size:165px;font-weight:900;line-height:1}

.stats{display:flex;gap:14px;margin-top:22px}

.stats b{display:block;font-size:44px;color:var(--ink);font-weight:700}
.locbtn{margin-top:18px;width:100%;padding:16px;border-radius:20px;border:1.5px solid var(--gold);background:rgba(255,199,102,.16);color:var(--gold);font-size:32px;font-weight:700;cursor:pointer;line-height:1.3}
.locbtn:hover{background:rgba(255,199,102,.32)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px;padding-top:18px;border-top:1.5px solid var(--edge);text-align:center;font-size:34px}
.days div{display:grid;gap:6px;justify-items:center;padding:10px 0;border-radius:18px;transition:.25s}
.days div:hover{background:rgba(255,255,255,.1);transform:translateY(-4px)}
.days b{font-weight:500;color:var(--dim);font-size:30px}.days svg{width:68px;height:68px}.days span{font-weight:700}
.dock{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:18px;padding:18px 24px;direction:ltr;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:44px;box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1.5px 0 rgba(255,255,255,.35)}
.app{position:relative;width:110px;height:110px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(160deg,#fff,#dfe3ea);box-shadow:0 10px 22px rgba(0,0,0,.4);text-decoration:none;color:#222;font:900 40px 'Heebo';border:0;cursor:pointer;transition:width .12s,height .12s;overflow:visible}
.app img{width:64%;height:64%;object-fit:contain;border-radius:8px}
.app img.full{width:100%;height:100%;object-fit:cover;border-radius:28px}
.app em{position:absolute;bottom:calc(100% + 22px);left:50%;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;font:500 28px 'Heebo';font-style:normal;white-space:nowrap;padding:8px 20px;background:rgba(30,26,26,.94);color:#fff;border-radius:16px;transition:.18s}

.app.bounce{animation:bounce .5s cubic-bezier(.3,0,.4,1) 2}
@keyframes bounce{40%{transform:translateY(-44px)}}
.sep{width:2px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.32)}

@keyframes pop{from{opacity:0;transform:scale(.94)}}
.card h2{font-size:21px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.x{background:none;border:0;color:var(--dim);cursor:pointer;padding:4px}.x:hover{color:#fff}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
.card input[type=text]{width:100%;padding:11px 14px;background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:11px;color:var(--ink);font:15px 'Heebo';outline:0}
.card input[type=text]:focus{border-color:var(--gold)}
.imgrow{display:flex;gap:12px;align-items:center}
.prev{width:64px;height:64px;flex:none;border-radius:16px;background:linear-gradient(160deg,#fff,#dfe3ea);display:grid;place-items:center;overflow:hidden;color:#222;font:900 26px 'Heebo'}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--ink);font-size:14px;cursor:pointer;transition:.2s}

.b.main2{background:linear-gradient(90deg,var(--red),#f0762f);border-color:transparent;font-weight:700}

.note{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.sub{margin:22px 0 8px;font-size:15px;font-weight:700;padding-top:18px;border-top:1px solid var(--edge)}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px}

.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px}.row .t span{display:block;font-size:12px;color:var(--dim);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{font-size:14px;color:var(--dim);padding:8px 2px}

 cx=512,cy=279.5,tx=vw/2-s*cx,ty=vh/2-s*cy;
 stage.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
 /* התאמה שטוחה (affine) במקום תלת-ממד: הטקסט נשאר חד בכל הדפדפנים */
 const O=[527.75,42.25],u=[369.5,1.5],v=[.5,234.5];
 ui.style.transform=`matrix(${s*u[0]/UW},${s*u[1]/UW},${s*v[0]/UH},${s*v[1]/UH},${s*O[0]+tx},${s*O[1]+ty})`}
addEventListener('resize',render);render();
/* ---- שעון ---- */
const pad=n=>String(n).padStart(2,'0');
function tick(){const d=new Date(),h=d.getHours();
 $('clock').textContent=pad(h)+':'+pad(d.getMinutes());
 $('hello').textContent=h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב';
 $('date').textContent=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,1000);
/* ---- קיצורים ---- */
let items=[];try{items=JSON.parse(localStorage.getItem('shortcuts')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('shortcuts',JSON.stringify(items))}catch(e){alert('אין מספיק מקום לשמירה. נסה תמונה קטנה יותר.')}};
const fixUrl=u=>/^https?:\/\//i.test(u)?u:'https://'+u;
const hostOf=u=>{try{return new URL(fixUrl(u)).hostname}catch(e){return''}};
/* מאגרי אייקונים באינטרנט, לפי סדר ניסיון */
const REPOS=h=>['https://www.google.com/s2/favicons?domain='+h+'&sz=128','https://icons.duckduckgo.com/ip3/'+h+'.ico','https://icon.horse/icon/'+h];
function iconEl(it){const h=hostOf(it.url),srcs=[];if(it.img)srcs.push(it.img);if(h)srcs.push(...REPOS(h));
 const img=new Image();img.alt='';if(it.img)img.className='full';let i=0;
 const nxt=()=>{if(i<srcs.length){img.className=(it.img&&i===0)?'full':'';img.src=srcs[i++]}else img.replaceWith(document.createTextNode((it.name||'?')[0]))};
 img.onerror=nxt;nxt();return img}
const dock=$('dock');
function buildDock(){dock.innerHTML='';
 items.forEach(it=>{const a=document.createElement('a');a.className='app';a.href=fixUrl(it.url);
  a.appendChild(iconEl(it));const em=document.createElement('em');em.textContent=it.name;a.appendChild(em);
  a.onclick=e=>{e.preventDefault();a.classList.add('bounce');setTimeout(()=>location.href=a.href,520)};dock.appendChild(a)});
 if(items.length){const s=document.createElement('div');s.className='sep';dock.appendChild(s)}
 const g=document.createElement('button');g.className='app gear';g.setAttribute('aria-label','הגדרות');
 g.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><em>הגדרות</em>';
 g.onclick=openModal;dock.appendChild(g)}
dock.addEventListener('mousemove',e=>{const k=dock.getBoundingClientRect().width/dock.offsetWidth;
 dock.querySelectorAll('.app').forEach(a=>{const r=a.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2))/k;
  a.style.width=a.style.height=(110+66*Math.pow(Math.max(0,1-d/250),1.6))+'px'})});
dock.addEventListener('mouseleave',()=>dock.querySelectorAll('.app').forEach(a=>a.style.width=a.style.height=''));
/* ---- חלון הגדרות ---- */
let editId=null,pending='';
const modal=$('modal');
function preview(){const p=$('prev');p.innerHTML='';const it={name:$('fname').value||'?',url:$('furl').value,img:pending};
 if(!it.url&&!it.img){p.textContent='?';return}p.appendChild(iconEl(it))}
function resetForm(){editId=null;pending='';['fname','furl','fimg'].forEach(i=>$(i).value='');$('save').textContent='הוסף קיצור';$('cancel').hidden=true;preview()}
function renderList(){const L=$('list');L.innerHTML='';
 if(!items.length){L.innerHTML='<div class="empty">עוד אין קיצורים. הוסף את הראשון למעלה.</div>';return}
 items.forEach(it=>{const r=document.createElement('div');r.className='row';
  const p=document.createElement('div');p.className='prev';p.appendChild(iconEl(it));
  const t=document.createElement('div');t.className='t';t.innerHTML='<b></b><span></span>';t.firstChild.textContent=it.name;t.lastChild.textContent=it.url;
  const e=document.createElement('button');e.className='b';e.textContent='עריכה';
  e.onclick=()=>{editId=it.id;pending=it.img||'';$('fname').value=it.name;$('furl').value=it.url;$('fimg').value=/^data:/.test(pending)?'':pending;$('save').textContent='שמור שינויים';$('cancel').hidden=false;preview();$('fname').focus()};
  const d=document.createElement('button');d.className='b';d.textContent='מחק';
  d.onclick=()=>{items=items.filter(x=>x.id!==it.id);save();buildDock();renderList();if(editId===it.id)resetForm()};
  r.append(p,t,e,d);L.appendChild(r)})}
function openModal(){modal.classList.add('open');renderList();preview()}
function closeModal(){modal.classList.remove('open');resetForm()}
$('close').onclick=closeModal;$('cancel').onclick=resetForm;
modal.addEventListener('mousedown',e=>{if(e.target===modal)closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
['fname','furl'].forEach(i=>$(i).addEventListener('input',preview));
$('fimg').addEventListener('input',e=>{pending=e.target.value.trim();preview()});
$('auto').onclick=()=>{pending='';$('fimg').value='';preview()};
$('up').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),m=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);pending=c.toDataURL('image/png');$('fimg').value='';preview()};im.src=fr.result};
 fr.readAsDataURL(f);e.target.value=''};
$('save').onclick=()=>{const name=$('fname').value.trim(),url=$('furl').value.trim();
 if(!name||!url){(name?$('furl'):$('fname')).focus();return}
 const it={id:editId||Date.now().toString(36),name,url,img:pending};
 if(editId)items=items.map(x=>x.id===editId?it:x);else items.push(it);
 save();buildDock();resetForm();renderList()};
buildDock();
/* ---- מזג אוויר ---- */
const CL=f=>`<path d="M20 46a10 10 0 0 1-1-20 14 14 0 0 1 27 3 9 9 0 0 1 0 17z" fill="${f||'#e8ecf2'}"/>`;
const SUN='<circle cx="32" cy="32" r="12" fill="#ffc766"/><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.6 5.6M44.8 44.8l5.6 5.6M13.6 50.4l5.6-5.6M44.8 19.2l5.6-5.6" stroke="#ffc766" stroke-width="4" stroke-linecap="round"/>';
const svg=b=>'<svg viewBox="0 0 64 64">'+b+'</svg>';
const WI=c=>svg(c===0?SUN:c<3?'<g transform="translate(-8,-8) scale(.7)">'+SUN+'</g><g transform="translate(6,4)">'+CL()+'</g>':c===3?CL():c<50?CL()+'<path d="M16 52h32M20 58h24" stroke="#cfd6e0" stroke-width="3.5" stroke-linecap="round"/>':c<70||(c>=80&&c<90)?CL('#cdd5e2')+'<path d="M24 50l-3 8M33 50l-3 8M42 50l-3 8" stroke="#6fb8ff" stroke-width="3.5" stroke-linecap="round"/>':c<80?CL()+'<g fill="#fff"><circle cx="24" cy="54" r="2.8"/><circle cx="33" cy="58" r="2.8"/><circle cx="42" cy="54" r="2.8"/></g>':CL('#aeb6c4')+'<path d="M34 40l-8 14h7l-3 10 12-16h-7z" fill="#ffc766"/>');
const WT=c=>c===0?'בהיר':c<3?'מעונן חלקית':c===3?'מעונן':c<50?'ערפל':c<60?'טפטוף':c<70?'גשם':c<80?'שלג':c<90?'ממטרים':'סופת רעמים';
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function paint(w){const c=w.cur;$('city').textContent=w.name;$('temp').textContent=Math.round(c.temperature_2m)+'°';$('ico').innerHTML=WI(c.weather_code);$('desc').textContent=WT(c.weather_code);
 $('stats').innerHTML='<div><b>'+Math.round(c.apparent_temperature)+'°</b>מרגיש</div><div><b>'+c.relative_humidity_2m+'%</b>לחות</div><div><b>'+Math.round(c.wind_speed_10m)+'</b>קמ״ש רוח</div>';
 const d=w.daily;$('days').innerHTML=d.time.slice(1,6).map((x,k)=>'<div><b>'+new Date(x).toLocaleDateString('he-IL',{weekday:'short'})+'</b>'+WI(d.weather_code[k+1])+'<span>'+Math.round(d.temperature_2m_max[k+1])+'° <b>'+Math.round(d.temperature_2m_min[k+1])+'°</b></span></div>').join('')}
async function update(loc){
 try{const j=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto')).json();
  const w={name:loc.name,cur:j.current,daily:j.daily,ts:Date.now()};LS.set('wx',w);paint(w)}
 catch(e){const c=LS.get('wx');if(c)paint(c);else{$('city').textContent=loc.name;$('desc').textContent='אין חיבור לשרת מזג האוויר'}}
 $('locbtn').hidden=loc.src==='gps'}
const gps=()=>new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,{timeout:10000,maximumAge:3e5}):rej(new Error('nogeo')));
async function cityName(la,lo){try{const d=await(await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+la+'&longitude='+lo+'&localityLanguage=he')).json();return d.city||d.locality||d.principalSubdivision||'המיקום שלך'}catch(e){return'המיקום שלך'}}
async function ipLoc(){try{const d=await(await fetch('https://ipapi.co/json/')).json();if(d.latitude)return{lat:d.latitude,lon:d.longitude,name:d.city||'המיקום שלך',src:'ip'}}catch(e){}return null}
async function locate(click){const btn=$('locbtn');if(click)btn.textContent='מאתר…';
 try{const c=await gps(),loc={lat:c.latitude,lon:c.longitude,name:await cityName(c.latitude,c.longitude),src:'gps'};LS.set('loc',loc);await update(loc);return}
 catch(e){btn.textContent=click?'הגישה חסומה. אפשר אותה בסמל המנעול ליד כתובת האתר':'אפשר גישה למיקום'}
 await update(LS.get('loc')||await ipLoc()||{lat:32.0114,lon:34.7748,name:'חולון',src:'ip'})}
$('locbtn').onclick=()=>locate(true);
{const c=LS.get('wx');if(c)paint(c)}
locate();setInterval(()=>{const l=LS.get('loc');if(l)update(l)},9e5);
/* ---- אבק נע ---- */
const cv=$('fx'),x=cv.getContext('2d'),P=[];
for(let i=0;i<60;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*3+.6,v:Math.random()*.00015+.00006,a:Math.random()*.5+.15});
(function f(){x.clearRect(0,0,UW,UH);for(const p of P){p.y-=p.v;p.x+=Math.sin(p.y*20)*.0002;if(p.y<0){p.y=1;p.x=Math.random()}
 x.beginPath();x.arc(p.x*UW,p.y*UH,p.r,0,7);x.fillStyle='rgba(255,214,150,'+p.a+')';x.fill()}requestAnimationFrame(f)})();
</script>
</body>
